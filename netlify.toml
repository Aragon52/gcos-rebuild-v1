# Netlify deployment for GCOS (TanStack Start, server-side rendered).
#
# One site serves all three portals; the subdomains are added as domain aliases:
#   globalcart-onlineshop.com           -> customer / main app
#   reseller.globalcart-onlineshop.com  -> reseller portal
#   admin.globalcart-onlineshop.com     -> admin portal
#
# Required environment variables on the Netlify site
# (Site configuration -> Environment variables):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   VITE_SUPABASE_PROJECT_ID
#   SUPABASE_SERVICE_ROLE_KEY   (server-side only, never exposed to the browser)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions-internal/server"
  status = 200
